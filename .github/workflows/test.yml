name: Tests

# PLUGIN-DEV-GUIDE §9 테스트 의무.
# 세 스위트 모두 의존성 0 (PHPUnit 불필요) 이라 매 push 마다 수초 안에 돕니다.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 릴리스 체크리스트 §6.3 — PHP 7.4~8.3 전 구간 지원
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring, dom
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { echo "::error file=$f::PHP syntax error"; fail=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './release/*')
          [ "$fail" -eq 0 ]

      - name: Static integrity tests
        run: php tests/test-plugin-integrity.php

      - name: Bootstrap & license gate tests
        run: php tests/test-bootstrap.php

      - name: SDK behaviour tests
        run: php tests/test-license-manager.php

  # Catalog core against real databases (MySQL + PostgreSQL), PHP 7.4 and 8.3.
  core-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dwc_test
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dwc_test
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql, gd, exif, mbstring
          coverage: none

      - name: Core integration tests (MySQL + PostgreSQL)
        env:
          DWC_MYSQL: "mysql:host=127.0.0.1;port=3306;dbname=dwc_test;charset=utf8mb4"
          DWC_MYSQL_USER: root
          DWC_MYSQL_PASS: root
          DWC_PGSQL: "pgsql:host=127.0.0.1;port=5432;dbname=dwc_test"
          DWC_PGSQL_USER: postgres
          DWC_PGSQL_PASS: postgres
        run: php tests/core/run.php

  build-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check build scripts
        run: |
          set -euo pipefail
          for f in build/*.js; do node --check "$f"; done
          bash -n .github/scripts/package-release.sh

  composer-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # 플러그인이 선언한 **최소** PHP 로 검증합니다. 최신 PHP 로만 확인하면
          # php ^8.1 전용 패키지가 lock 에 섞여도 못 잡습니다 (실제로 발생한 사고).
          php-version: '7.4'
          coverage: none

      - name: composer.lock 존재 · 동기화 · 취약점
        # lock 이 없으면 vendor 가 빌드마다 달라져 TAMPER_DETECTED 를 유발합니다 (§11.2.b).
        run: |
          set -euo pipefail
          test -f composer.lock || { echo "::error::composer.lock missing (§11.2.b)"; exit 1; }

          # composer.json 과 lock 이 어긋나 있지 않은지
          composer validate --no-check-publish --check-lock

          # vendor 설치 없이 lock 파일 자체를 감사
          composer audit --locked --no-dev

      - name: 선언한 최소 PHP 에서 실제로 설치되는지
        # 이 스텝이 없었다면 php ^8.1 전용 패키지가 실린 채로 출하됐을 것입니다.
        run: |
          set -euo pipefail
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          composer check-platform-reqs --no-dev
